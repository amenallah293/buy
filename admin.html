<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم - الأسعار</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2FB;--surface:#fff;--ink:#1B1740;--muted:#5E5A80;--accent:#6D28D9;--on-accent:#fff;--line:#DDD8F0;--ok:#0F7B5F;--err:#C2410C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14112B;--surface:#1E1A3D;--ink:#F1EEFF;--muted:#B2ACD6;--accent:#A78BFA;--on-accent:#14112B;--line:#38336A;--ok:#4ADE9A;--err:#F59E0B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;line-height:1.6;font-size:16px}
main{max-width:560px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:24px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
section h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=password],input[type=number]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row input{flex:1}
.row button{flex:0 0 auto;background:var(--err);color:#fff;border:0;border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer}
.add-btn{background:transparent;border:2px dashed var(--line);color:var(--accent);border-radius:10px;padding:8px;width:100%;font:inherit;font-weight:700;cursor:pointer;margin-top:6px}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;cursor:pointer}
.btn[disabled]{opacity:.5}
#msg{margin-top:12px;font-size:14px;font-weight:700;min-height:20px}
#msg.ok{color:var(--ok)}
#msg.err{color:var(--err)}
.col-head{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
.col-head span{flex:1}
.gate{max-width:360px;margin:60px auto;text-align:center}
.gate input{text-align:center;font-size:22px;letter-spacing:4px}
</style>
</head>
<body>
<main>
<div id="gate" class="gate">
<h1>🔒 لوحة التحكم</h1>
<label for="pin">كلمة السر</label>
<input type="password" id="pin" inputmode="numeric" placeholder="••••">
<button class="btn" id="gate-ok" type="button">دخول</button>
<p id="gate-msg" style="color:var(--err);font-size:14px"></p>
</div>

<div id="app" hidden>
<h1>لوحة التحكم - الأسعار</h1>
<p class="sub">أي تعديل هنا ينشر مباشرة على موقعك خلال دقيقة تقريباً.</p>

<section>
<h2>إعداد الاتصال بـ GitHub (مرة واحدة فقط على هذا الجهاز)</h2>
<label>اسم المستخدم على GitHub</label>
<input type="text" id="owner" placeholder="amenallah293">
<label>اسم المستودع (Repository)</label>
<input type="text" id="repo" placeholder="buy-likes-and-followers-for-instagram-">
<label>مفتاح الوصول (Personal Access Token)</label>
<input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
<button class="btn" id="save-conn" type="button">حفظ الاتصال</button>
</section>

<section>
<h2>رقم واتساب</h2>
<input type="text" id="phone" placeholder="21699810230" dir="ltr">
<label>وحدة السعر</label>
<input type="text" id="priceUnit" placeholder=" دينار">
</section>

<section>
<h2>باقات المتابعين</h2>
<div class="col-head"><span>الكمية</span><span>السعر</span><span style="flex:0 0 34px"></span></div>
<div id="rows-f"></div>
<button class="add-btn" id="add-f" type="button">+ إضافة باقة</button>
</section>

<section>
<h2>باقات اللايكات</h2>
<div class="col-head"><span>الكمية</span><span>السعر</span><span style="flex:0 0 34px"></span></div>
<div id="rows-l"></div>
<button class="add-btn" id="add-l" type="button">+ إضافة باقة</button>
</section>

<button class="btn" id="load-btn" type="button">تحميل الأسعار الحالية من الموقع</button>
<button class="btn" id="publish-btn" type="button">نشر التعديلات على الموقع</button>
<div id="msg"></div>
</div>
</main>

<script>
var $=function(i){return document.getElementById(i)};
var ADMIN_PIN="2580"; // غيّر هذا الرقم من هنا لتغيير كلمة سر الدخول للوحة
var FILE_SHA=null;

try{
 var saved=JSON.parse(localStorage.getItem("gh-conn")||"{}");
 $("owner").value=saved.owner||"";
 $("repo").value=saved.repo||"";
 $("token").value=saved.token||"";
}catch(e){}

$("gate-ok").onclick=function(){
 if($("pin").value===ADMIN_PIN){
  $("gate").hidden=true;$("app").hidden=false;
 }else{
  $("gate-msg").textContent="كلمة السر غير صحيحة.";
 }
};
$("pin").addEventListener("keydown",function(e){if(e.key==="Enter")$("gate-ok").click()});

$("save-conn").onclick=function(){
 var conn={owner:$("owner").value.trim(),repo:$("repo").value.trim(),token:$("token").value.trim()};
 try{localStorage.setItem("gh-conn",JSON.stringify(conn))}catch(e){}
 setMsg("تم حفظ بيانات الاتصال على هذا الجهاز.","ok");
};

function setMsg(t,cls){var m=$("msg");m.textContent=t;m.className=cls||""}

function addRow(containerId,qty,price){
 var div=document.createElement("div");
 div.className="row";
 div.innerHTML='<input type="number" class="q" value="'+(qty!=null?qty:"")+'" placeholder="الكمية">'+
  '<input type="number" class="p" value="'+(price!=null?price:"")+'" placeholder="السعر">'+
  '<button type="button">×</button>';
 div.querySelector("button").onclick=function(){div.remove()};
 $(containerId).appendChild(div);
}
$("add-f").onclick=function(){addRow("rows-f")};
$("add-l").onclick=function(){addRow("rows-l")};

function readPacks(containerId){
 var out=[];
 $(containerId).querySelectorAll(".row").forEach(function(row){
  var q=parseInt(row.querySelector(".q").value,10);
  var p=parseFloat(row.querySelector(".p").value);
  if(!isNaN(q)&&!isNaN(p))out.push([q,p]);
 });
 out.sort(function(a,b){return a[0]-b[0]});
 return out;
}

function fillPacks(containerId,arr){
 $(containerId).innerHTML="";
 (arr||[]).forEach(function(p){addRow(containerId,p[0],p[1])});
}

function apiUrl(){
 var o=$("owner").value.trim(),r=$("repo").value.trim();
 return "https://api.github.com/repos/"+o+"/"+r+"/contents/config.json";
}

$("load-btn").onclick=function(){
 setMsg("جارٍ التحميل...","");
 fetch(apiUrl(),{headers:{Authorization:"token "+$("token").value.trim()}})
  .then(function(r){if(!r.ok)throw new Error("تعذر الوصول للملف. تحقق من اسم المستخدم والمستودع والمفتاح.");return r.json()})
  .then(function(data){
   FILE_SHA=data.sha;
   var cfg=JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g,"")))));
   $("phone").value=cfg.phone||"";
   $("priceUnit").value=cfg.priceUnit||"";
   fillPacks("rows-f",cfg.f);
   fillPacks("rows-l",cfg.l);
   setMsg("تم تحميل الأسعار الحالية.","ok");
  })
  .catch(function(e){setMsg(e.message,"err")});
};

$("publish-btn").onclick=function(){
 var owner=$("owner").value.trim(),repo=$("repo").value.trim(),token=$("token").value.trim();
 if(!owner||!repo||!token){setMsg("أكمل بيانات الاتصال بـ GitHub أولاً واضغط حفظ الاتصال.","err");return}
 var cfg={phone:$("phone").value.trim(),priceUnit:$("priceUnit").value,f:readPacks("rows-f"),l:readPacks("rows-l")};
 var content=btoa(unescape(encodeURIComponent(JSON.stringify(cfg,null,2))));
 setMsg("جارٍ النشر...","");
 function put(sha){
  var body={message:"تحديث الأسعار من لوحة التحكم",content:content};
  if(sha)body.sha=sha;
  return fetch(apiUrl(),{
   method:"PUT",
   headers:{Authorization:"token "+token,"Content-Type":"application/json"},
   body:JSON.stringify(body)
  });
 }
 (FILE_SHA?Promise.resolve({sha:FILE_SHA}):fetch(apiUrl(),{headers:{Authorization:"token "+token}}).then(function(r){return r.ok?r.json():{}}))
  .then(function(info){return put(info.sha)})
  .then(function(r){
   if(!r.ok)return r.json().then(function(e){throw new Error(e.message||"فشل النشر")});
   return r.json();
  })
  .then(function(data){
   FILE_SHA=data.content.sha;
   setMsg("✓ تم النشر بنجاح. ستظهر التغييرات على الموقع خلال دقيقة تقريباً.","ok");
  })
  .catch(function(e){setMsg(e.message,"err")});
};
</script>
</body>
</html>
